# F6 pilot: 3 -> 10 -> 18 companies of real_v1 on the real 2024-2025 signals, seeds 1-3 (not reused by E5).
# Every step keeps ~111 investors per company (each investor trades 4 companies), 20,000 USD of cash per investor
# and the same value of every company outstanding, so the three steps differ only in the size of the network.
# Calibration: docs/guides/f6_full_network.md.
base:
  name: f6_pilot
  exchange_backend: cpp
  graph: real_v1                  # 18 companies, 4 commodities, S&P 500 (data/graph/real_v1)
  external: real_2024_2025        # marketsim.graph.scenarios.build_real_2024_2025() writes it to data/processed
  use_market_index: true
  n_sessions: 502                 # trading days of 2024-2025
  warmup_sessions: 10
  sample_dt: 0.05
  agents: &agents
    assets: []                    # empty = all 18 companies
    composition: mixed            # the investor counts below are redistributed by the named mix
    valuers_myopic: 500
    valuers_network: 0
    trend: 0
    noise: 0
    rebalancers: 25               # funds with target weights, on top of the 500 investors
    rebalance_band: 0.05
    n_funds: 50
    concentration: 0.5
    total_cash_cents: 1000000000  # 20,000 USD of cash per investor on average
    total_shares: 8000            # per company, for a 100 USD stock: 800,000 USD of every company outstanding
    price_scaling: true           # share counts, maker quotes and tick parameters follow each start price
    holdings: followed            # shares of a company go only to the investors that trade it
    attention: 4
    rho: 0.02
    decision_rate: 2.0
    market_makers_per_asset: 2
    market_maker_rate: 20.0
    market_maker_qty: 50
    market_maker_spread_ticks: 10
    inventory_skew_ticks: 0.3
    trend_lookback: 5.0           # trend followers watch a week, not a day
    trend_scale: 0.1
    tif: GTD
    order_lifetime: 0.5
    observation_delay: 0.05
    weight_error_std: 0.1
    risk_limit: 0.2               # stop-loss of one investor in ten: sell half of every position
    risk_limit_share: 0.1
    risk_sell_fraction: 0.5
    risk_cooldown: 5.0
    ablation: none
    herding:
      h: 0.2
      neighbors: 5
      followers: 1.0
      h_std: 0.0
seeds: [1, 2, 3]
grid:
  agents:
    - <<: *agents                 # oil producers and a refiner
      assets: [COP, EOG, VLO]
      valuers_myopic: 111
      rebalancers: 6
      n_funds: 11
      total_cash_cents: 222000000
    - <<: *agents                 # the oil cluster, a copper miner, a gold miner and the bank
      assets: [COP, EOG, VLO, MPC, DAL, UAL, ODFL, FCX, NEM, JPM]
      valuers_myopic: 278
      rebalancers: 14
      n_funds: 28
      total_cash_cents: 556000000
    - *agents
